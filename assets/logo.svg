<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="920" height="200" role="img" aria-label="Sirpro Soluciones Profesionales">
  <defs>
    <linearGradient id="azulA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="azulB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f2a5f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="920" height="200" rx="18" fill="#ffffff"/>

  <!-- circuitos decorativos -->
  <g stroke="#3b82f6" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M30 132 A 80 80 0 0 1 64 54"/>
    <path d="M16 100 H 46"/>
    <path d="M240 62 A 72 72 0 0 1 254 138"/>
    <path d="M258 150 H 218"/>
  </g>
  <g fill="#3b82f6" opacity="0.9">
    <circle cx="16" cy="100" r="7"/>
    <circle cx="64" cy="54" r="7"/>
    <circle cx="254" cy="138" r="7"/>
    <circle cx="258" cy="150" r="7"/>
    <rect x="284" y="42" width="18" height="18" rx="4" transform="rotate(45 293 51)"/>
    <rect x="26" y="38" width="14" height="14" rx="3" transform="rotate(45 33 45)"/>
  </g>

  <!-- cluster de tres rombos -->
  <rect x="112" y="34" width="72" height="72" rx="14" fill="url(#azulA)" transform="rotate(45 148 70)"/>
  <rect x="58" y="104" width="72" height="72" rx="14" fill="url(#azulB)" transform="rotate(45 94 140)"/>
  <rect x="166" y="104" width="72" height="72" rx="14" fill="url(#azulB)" transform="rotate(45 202 140)"/>

  <!-- texto -->
  <text x="330" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="96" font-weight="700" fill="#0f2a5f" letter-spacing="-1">Sirpro</text>
  <text x="334" y="160" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1e3a8a" letter-spacing="5">SOLUCIONES PROFESIONALES</text>
</svg>
